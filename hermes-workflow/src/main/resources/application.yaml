server:
  port: 9090

spring:
  datasource:
    driver-class-name: com.ibm.as400.access.AS400JDBCDriver
    url: jdbc:as400://system/bib;translate binary=true
    username: user
    password: pass

  freemarker:
    template-loader-path: classpath:/templates/
    suffix: .ftl
    charset: UTF-8
    check-template-location: true

workflow:
  hot-folder: /path/to/hotfolder
  default-workflow: classpath:/workflows/emailWorkflow.yaml
  executeSql:
    defaultQuery: "SELECT 'Fallback' AS Wert FROM SYSIBM.SYSDUMMY1"
  applyTemplate:
    subjectTemplate: classpath:/templates/emailSubject.ftl
    bodyTemplate: classpath:/templates/emailBody.ftl
  transform:
    type: csv

export:
  xslt-path: classpath:/xslt
  file-path: classpath:/export
  formats: html, json, jsonl, csv, md

as400:
  system: YOUR_SYSTEM
  username: YOUR_USER
  password: YOUR_PWD

dataqueue:
  library: YOUR_LIB
  rpg2java: RP2JQ
  java2rpg: J2RPQ
  max-entry-length: 512
  description: "Java-RPG Integration Queue"

mail:
  host: ip
  port: port
  username: user
  password: pass
  from: noreply@example.com
  properties:
    mail.smtp.auth: false
    mail.smtp.starttls.enable: false

encryption:
  key: mySuperSecretKey0815

fallback:
  recipients: "my.mail@localhost.local"
